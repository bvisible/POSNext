name: build-frontend

on:
  push:
    branches: [version-15]
    paths:
      - 'POS/**'
      - 'package.json'
      - '!**/node_modules/**'
      - '!pos_next/public/pos/**'
      - '!pos_next/www/pos.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: cd POS && yarn install

      - name: Build
        env:
          FORCE_REBUILD: '1'
        run: yarn build

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pos_next/public/pos pos_next/www/pos.html
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          git push
