name: build-frontend

on:
  push:
    branches: [version-15]
    paths:
      - 'POS/**'
      # //// Neoffice — a change to this very file rebuilds, so that a fix of the build is tried by its own push
      - '.github/workflows/build-frontend.yml'
      - 'package.json'
      - '!**/node_modules/**'
      - '!pos_next/public/pos/**'
      - '!pos_next/www/pos.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        # --frozen-lockfile: refuse to mutate yarn.lock so the CI build uses the
        # exact same dep versions as the committed POS/yarn.lock. Without it,
        # every rebuild can pull newer frappe-ui / radix-vue and silently
        # introduce regressions (notably 2026-05-28: Radix Vue Dialog click-to-
        # focus break that made the Create Customer dialog inputs unusable).
        run: cd POS && yarn install --frozen-lockfile

      - name: Build
        env:
          FORCE_REBUILD: '1'
        run: yarn build

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # //// Neoffice — upstream develop registers /pos-sw.js from POS/src/main.js; without this the installed web app has no service worker
          git add pos_next/public/pos pos_next/www/pos.html pos_next/www/pos-sw.js
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          # //// Neoffice — the fork-markers bot pushes its own commit right after every push, often while this job is still building: a plain `git push` was then refused ("fetch first") and the artifacts of that commit never reached the branch (2026-11-03, the till of osiris kept the previous bundle). Take what arrived on top (the build leaves untracked-by-us changes behind: autostash), then push again, a few times.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
