exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "pos_next.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                pos_next/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                pos_next/templates/includes/.*|
                pos_next/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                pos_next/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                pos_next/templates/includes/.*|
                pos_next/public/js/lib/.*
            )$

  # //// Neoffice — added hook, no upstream equivalent. This fork diverges from
  # //// BrainWise-DEV/POSNext by ~105k lines and is re-merged with it, so every change to a
  # //// tracked file must carry a `////` marker saying why. The hook refuses a commit that
  # //// touches a file listed in .bvisible-tracked-files without adding one; the
  # //// `Annotate: skip` git trailer is the official bypass for trivial commits (0e92ed6a,
  # //// 2026-05-19 "chore(annotations): pre-commit hook + CLAUDE.md governance section").
  - repo: local
    hooks:
      - id: check-fork-annotations
        name: "Enforce //// markers on upstream-tracked fork files"
        entry: python3 scripts/check_annotations.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
